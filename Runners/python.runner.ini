; =============================================================================
; Python Runner Pack for Pythia
; Pacote Runner Python para o Pythia
;
; English:
;   Runs Python programs by shelling out to python.exe on the system PATH.
;   Requires Python 3.x installed. Download from https://python.org
;   During install, tick "Add Python to PATH".
;
; Português:
;   Executa programas Python chamando python.exe no PATH do sistema.
;   Requer Python 3.x instalado. Baixe em https://python.org
;   Durante a instalação, marque "Add Python to PATH".
;
; Installation / Instalação:
;   This file is already in the Runners\ folder.
;   Restart Pythia to activate. / Reinicie o Pythia para ativar.
; =============================================================================

[Meta]
Name=Python
Code=py
Extension=.py
Author=Nomidor Software
Version=1.0
IsBuiltIn=0

[Runtime]
; shell = run via external process / roda como processo externo
Mode=shell
Command=python
; {file} = path to temp source file / caminho para arquivo fonte temporario
Args={file}
; {filedir} = directory of source file / diretório do arquivo fonte
WorkDir={filedir}
Encoding=utf-8

[Detect]
; Command used to check if Python is installed / Comando para verificar se Python está instalado
TestCommand=python --version
MinVersion=3.0

[Editor]
CommentPrefix=#
; Default starter code (\n = newline) / Código inicial padrão (\n = nova linha)
Starter=# Python program\n# Programa Python\n\nprint("Hello, World!")
TabWidth=4
IndentChar=space

[Display]
; Python blue / Azul do Python
Color=#4B8BBE
Icon=py
