; =============================================================================
; Pascal Runner Pack -- Pythia built-in
; Pacote Runner Pascal -- embutido no Pythia
;
; English:  This is the built-in Pascal runner. It uses Pythia's own
;           interpreter. No external executable is required.
; Português: Este é o runner Pascal embutido. Usa o interpretador próprio
;           do Pythia. Nenhum executável externo é necessário.
;
; NOTE: This file documents the built-in. Editing it has no effect.
;       Pythia loads Pascal support from compiled-in code, not this file.
; NOTA: Este arquivo documenta o embutido. Editá-lo não tem efeito.
; =============================================================================

[Meta]
Name=Pascal
Code=pascal
Extension=.mdp
Author=Nomidor Software
Version=1.0
IsBuiltIn=1

[Runtime]
Mode=internal
Command=
Args=
WorkDir=
Encoding=utf-8

[Detect]
TestCommand=
MinVersion=

[Editor]
CommentPrefix=//
Starter=program NewProgram;\n\nbegin\n  writeln('Hello, World!');\nend.
TabWidth=2
IndentChar=space

[Display]
Color=#0070C0
Icon=pascal
