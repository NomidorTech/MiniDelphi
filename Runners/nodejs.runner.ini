; =============================================================================
; Node.js Runner Pack for Pythia
; Pacote Runner Node.js para o Pythia
;
; English:
;   Runs JavaScript programs via Node.js. Download from https://nodejs.org
;
; Português:
;   Executa programas JavaScript via Node.js. Baixe em https://nodejs.org
; =============================================================================

[Meta]
Name=JavaScript (Node.js)
Code=js
Extension=.js
Author=Community
Version=1.0
IsBuiltIn=0

[Runtime]
Mode=shell
Command=node
Args={file}
WorkDir={filedir}
Encoding=utf-8

[Detect]
TestCommand=node --version
MinVersion=14.0

[Editor]
CommentPrefix=//
Starter=// JavaScript program\n// Programa JavaScript\n\nconsole.log("Hello, World!");
TabWidth=2
IndentChar=space

[Display]
Color=#F7DF1E
Icon=js
