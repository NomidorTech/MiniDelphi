; =============================================================================
; Lua Runner Pack for Pythia
; Pacote Runner Lua para o Pythia
;
; English:
;   Runs Lua programs by shelling out to lua.exe on the system PATH.
;   Download LuaBinaries from https://luabinaries.sourceforge.net/
;   and place lua54.exe (or lua.exe) on your PATH.
;
; Português:
;   Executa programas Lua chamando lua.exe no PATH do sistema.
;   Baixe LuaBinaries em https://luabinaries.sourceforge.net/
;   e coloque lua54.exe (ou lua.exe) no seu PATH.
; =============================================================================

[Meta]
Name=Lua
Code=lua
Extension=.lua
Author=Community
Version=1.0
IsBuiltIn=0

[Runtime]
Mode=shell
Command=lua
Args={file}
WorkDir={filedir}
Encoding=utf-8

[Detect]
TestCommand=lua -v
MinVersion=5.0

[Editor]
CommentPrefix=--
Starter=-- Lua program\n-- Programa Lua\n\nprint("Hello, World!")
TabWidth=2
IndentChar=space

[Display]
Color=#000080
Icon=lua
